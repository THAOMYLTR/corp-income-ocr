# =============================================================================
# DOCUMENT CLASSIFICATION MATRIX — CORP INCOME (khách hàng doanh nghiệp, KHDN)
# =============================================================================
#
# THIS IS THE SOURCE OF TRUTH for document routing. Editing this file changes
# which document is recognised and which BRD item is extracted from it — no
# Python change required. Same format as the SME repo's matrix; the upload
# boxes (groups) are the same seven folders.
#
# BRD "Corp Income Assessment", sheet "Corp income (detail)", use case
# "Pháp lý doanh nghiệp":
#   mục 1  legal_basic_extraction   Thông tin cơ bản về pháp lý doanh nghiệp
#   mục 2  shareholders_extraction  Cổ đông, thành viên góp vốn
#   mục 3  legal_rep_extraction     Người đại diện pháp luật
#   mục 4  liabilities_extraction   Nợ thuế, BHXH, phạt hành chính, tranh chấp
#   EACH flag costs one LLM call per matching document.
#
# --- How to read a `type` ----------------------------------------------------
#   id        : technical key, never changed (it is written into logs/monitoring).
#   label     : the document line as it appears on the checklist.
#   short_label : a caption for the reader of the finished report.
#   source    : where the facts come from — the BRD checks compare sources.
#                 customer = KH cung cấp
#                 field    = báo cáo thực địa / AI Site Visit / RBO
#                 external = bản tra cứu Cổng ĐKDN, cơ quan thuế, BHXH
#                 internal = bản in từ hệ thống nội bộ (BCDE, BEP, DBX)
#   filename_keywords : scored against the FILENAME ONLY, whole word, at 3x.
#               For abbreviations people put in filenames (gcn, dkkd, qd…).
#   keywords  : scored against the FILENAME (3x) and the CONTENT. Unaccented,
#               lowercase by convention; accents are stripped before comparing.
#   agents    : CORP_INCOME_AGENT: R (required evidence) or O (optional).
#               An empty mapping means the type is recognised but not used.
#   requirement.cap_moi : "Bắt buộc" makes the evidence-gap check stop the run
#               when no document of this type was uploaded.
#
# --- A group without types ---------------------------------------------------
# `catch_all: true` and no `types` declares an upload box that classifies
# nothing: the file is read and kept as general context. See `ho_so_khac`.

version: 1

# One programme for now; kept so the matrix and the notebook have the same
# shape as the SME repo and a future split (e.g. by customer segment) is a
# data change, not a code change.
