  - id: so_dang_ky_co_dong
    label: "Sổ đăng ký cổ đông / Sổ đăng ký thành viên / Danh sách thành viên góp vốn"
    source: customer
    keywords:
      - so dang ky co dong
      - so co dong
      - so dang ky thanh vien
      - danh sach co dong
      - danh sach thanh vien
      - danh sach co dong sang lap
