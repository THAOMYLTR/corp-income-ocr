# =============================================================================
# CORP INCOME — DOCUMENT TYPES (khách hàng doanh nghiệp, KHDN)
# =============================================================================
# Source of truth: which corporate document is which, which upload folder it
# belongs in, and which BRD extraction pass runs on it. Editing this file
# changes classification without any Python change.
#
# BRD "Corp Income Assessment", sheet "Corp income (detail)", items 1-4
# (use case "Pháp lý doanh nghiệp"):
#   legal_basic   — mục 1: Thông tin cơ bản về pháp lý doanh nghiệp
#   shareholders  — mục 2: Cổ đông, thành viên góp vốn
#   legal_rep     — mục 3: Người đại diện pháp luật
#   liabilities   — mục 4: Nợ thuế, BHXH, phạt hành chính, tranh chấp
#
# --- Fields ------------------------------------------------------------------
#   id        : technical key, never renamed.
#   label     : document name as it appears on the checklist.
#   source    : customer = KH cung cấp | field = báo cáo thực địa (ĐVKD/AI Site
#               Visit/RBO) | external = bản tra cứu Cổng ĐKDN / cơ quan thuế /
#               BHXH. Cross-checks compare facts BETWEEN sources, so this tag
#               matters: two customer papers agreeing proves less than a
#               customer paper agreeing with the national register.
#   keywords  : unaccented, lowercase. Filename hits score 3x content hits.
#   passes    : BRD extraction passes run on this type. EACH pass costs one
#               LLM call per matching document.
# =============================================================================

version: 1

# --- Upload folders ("boxes") -------------------------------------------------
# Put each file in the folder for its group. The folder narrows classification
# to that group's types (like the SME repo's ho_so_* upload boxes), so a GCN in
# ho_so_phap_ly can never be mistaken for a tax notice.
#   default_type : used when nothing in the group matches (e.g. any file in
#                  bao_cao_thuc_dia IS a field report). Omit to leave it "khac".
#   types        : the candidates inside this folder.
# Files outside every folder, or in ho_so_khac, are scored against ALL types.
boxes:
  ho_so_phap_ly:
    label: "Hồ sơ pháp lý (KH cung cấp)"
    types: [gcn_dkdn, dieu_le, so_dang_ky_co_dong, chuyen_nhuong_von, quyet_dinh_bo_nhiem]
  ho_so_thue_bhxh_tranh_chap:
    label: "Thuế, BHXH, xử phạt, tranh chấp (KH cung cấp)"
    types: [thong_bao_no_thue, xac_nhan_bhxh, quyet_dinh_xu_phat, bien_ban_kiem_tra, ho_so_tranh_chap, thuyet_minh_bctc]
  bao_cao_thuc_dia:
    label: "Báo cáo thực địa / AI Site Visit / RBO"
    types: [bao_cao_thuc_dia]
    default_type: bao_cao_thuc_dia
  tra_cuu_ben_ngoai:
    label: "Bản tra cứu bên ngoài (Cổng ĐKDN, thuế, BHXH, masothue)"
    types: [tra_cuu_dkdn, tra_cuu_no_thue_bhxh]
    default_type: tra_cuu_dkdn
  ho_so_khac:
    label: "Hồ sơ khác (tự phân loại)"
    types: []


types:
  - id: gcn_dkdn
    label: "Giấy chứng nhận đăng ký doanh nghiệp (GCN ĐKDN)"
    source: customer
    keywords:
      - giay chung nhan dang ky doanh nghiep
      - chung nhan dang ky doanh nghiep
      - dang ky kinh doanh
      - gcn dkdn
      - gcndkdn
      - dkkd
      - ma so doanh nghiep
      - dang ky thay doi lan thu
    passes: [legal_basic, shareholders, legal_rep]

  - id: dieu_le
    label: "Điều lệ công ty"
    source: customer
    keywords:
      - dieu le cong ty
      - dieu le to chuc va hoat dong
      - dieu le
